syntax = "proto3";

package panoptes.auth;

import "common.proto";

option go_package = "github.com/elebirds/panoptes/internal/gen/auth";
option csharp_namespace = "Panoptes.Protocol.Auth";

service AuthService {
  rpc Login  (LoginRequest)  returns (LoginResponse);
  rpc Logout (LogoutRequest) returns (panoptes.common.Status);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  panoptes.common.Status status = 1;
  string                 token  = 2;
  panoptes.common.Player player = 3;
}

message LogoutRequest {
  string token = 1;
}
