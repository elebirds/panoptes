syntax = "proto3";

package panoptes.proto.v1;

import "data_types.proto";

option go_package = "github.com/elebirds/panoptes/internal/gen/proto/v1;protov1";
option csharp_namespace = "Panoptes.Protocol.V1";

message UnitCatalogEntry {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;
  string prefab_key = 5;
}

message BuildingCatalogEntry {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;
  string prefab_key = 5;
}

message TechnologyCatalogEntry {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;
  string branch = 5;
  int32 tier = 6;
  int32 tech_point_cost = 7;
}

message TechnologyTreePoint {
  float x = 1;
  float y = 2;
}

message TechnologyTreeNodeEntry {
  string id = 1;
  string technology_id = 2;
  string title = 3;
  string description = 4;
  float x = 5;
  float y = 6;
  float width = 7;
  float height = 8;
  bool visible = 9;
}

message TechnologyTreeEdgeEntry {
  string id = 1;
  string from = 2;
  string to = 3;
  string arrow = 4;
  bool show_arrow = 5;
  float thickness = 6;
  repeated TechnologyTreePoint points = 7;
}

message TechnologyTreeLayout {
  string config_version = 1;
  repeated TechnologyTreeNodeEntry nodes = 2;
  repeated TechnologyTreeEdgeEntry edges = 3;
}

message RecipeCatalogEntry {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;
  string building_id = 5;
  int32 duration_turns = 6;
}

message TerrainCatalogEntry {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon_key = 4;
  string material_key = 5;
}

message StaticCatalogSnapshot {
  StaticCatalogManifest manifest = 1;
  repeated ResourceDescriptor resources = 2;
  repeated UnitCatalogEntry units = 3;
  repeated BuildingCatalogEntry buildings = 4;
  repeated TechnologyCatalogEntry technologies = 5;
  repeated RecipeCatalogEntry recipes = 6;
  repeated TerrainCatalogEntry terrains = 7;
  TechnologyTreeLayout technology_tree = 8;
}

message MsgStaticCatalogManifest {
  StaticCatalogManifest manifest = 1;
}

message MsgStaticCatalogSnapshot {
  StaticCatalogSnapshot snapshot = 1;
}