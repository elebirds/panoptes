syntax = "proto3";

package panoptes.proto.v1;

import "common.proto";
import "data_types.proto";
import "game_state.proto";

option go_package = "github.com/elebirds/panoptes/internal/gen/proto/v1;protov1";
option csharp_namespace = "Panoptes.Protocol.V1";


// ===== 客户端→服务端 =====

message MsgSetPolicy {
  string policy = 1;
  // "ready_for_war|expansion|recuperation|diplomacy"
}

message MsgMinisterDirective {
  string minister_role = 1;
  string content = 2;
}

message MsgTokenBuild {
  string node_id = 1;
  string building_type = 2;
  string castle_id = 3;
}

message MsgTokenExpandTerritory {
  string unit_id = 1;
  string center_node_id = 2; // optional, empty = unit current node
}

message MsgTokenReveal {
  string node_id = 1;
}

message MsgTokenVeto {
  string action_id = 1;
}

message MsgTokenAdjustFlow {
  string from_node = 1;
  string to_node = 2;
  string resource_type = 3;
  int32 amount = 4;
}

message MsgBuildRoad {
  string from_node = 1;
  string to_node = 2;
  // 服务端A*自动寻路
  // 若玩家指定路径点，放入waypoints
  repeated Position waypoints = 3;
}

message MsgSubmitDomestic {}

// ===== 服务端→客户端 =====

message MsgDomesticPhaseStart {
  int32 timeout = 1;
  int32 turn = 2;
  int32 tokens = 3;
  string current_policy = 4;
  string phase = 5;
}

message MsgTokenResult {
  bool success = 1;
  string action = 2;
  int32 tokens_left = 3;
  string error_code = 4; // 失败时填
}

message MsgRevealResult {
  string node_id = 1;
  NodeView true_state = 2;
  int32 tokens_left = 3;
}

message MsgMinisterAction {
  string minister = 1;
  string action_id = 2;
  repeated MinisterActionItem actions = 3;
  string report = 4; // 叙事轨（LLM生成）
}

message MinisterActionItem {
  string type = 1;
  // "build|repair_road|move_units|redirect_flow"
  map<string, string> params = 2;
}

message MsgDomesticSettlement {
  repeated DomesticChange changes = 1;
  ResourceBag my_resources_after = 2;
  int32 turn = 3;
  string phase = 4;
  string next_phase = 5;
}

message MsgTerritoryExpanded {
  bool success = 1;
  string error_code = 2;
  string player_id = 3;
  string unit_id = 4;
  string center_node_id = 5;
  string barracks_node_id = 6;
  repeated NodeView updated_nodes = 7;
  repeated string removed_unit_ids = 8;
}

message DomesticChange {
  string type = 1;
  map<string, string> data = 2;
}
