syntax = "proto3";

package panoptes.proto.v1;

import "common.proto";

option go_package = "github.com/elebirds/panoptes/internal/gen/proto/v1;protov1";
option csharp_namespace = "Panoptes.Protocol.V1";

message Room {
  string room_id = 1;
  string room_code = 2; // 6位邀请码
  string name = 3;
  repeated RoomPlayer players = 4;
  string status = 5; // "waiting|ready|starting"
  int32 max_players = 6;
}

// 客户端→服务端
message MsgCreateRoom {
  string name = 1;
  int32 max_players = 2;
}

message MsgJoinRoom {
  string room_code = 1;
}

message MsgLeaveRoom {}

message MsgReadyUp {}

// 服务端→客户端
message MsgRoomCreated {
  string room_id = 1;
  string room_code = 2; // 6位邀请码
}

message MsgRoomState {
  string room_id = 1;
  string room_code = 2;
  string name = 3;
  repeated RoomPlayer players = 4;
  string status = 5; // "waiting|ready|starting"
  int32 max_players = 6;
}

message RoomPlayer {
  string player_id = 1;
  string username = 2;
  bool is_ready = 3;
  bool is_host = 4;
}

message MsgGameStarting {
  int32 countdown = 1; // 秒
}

message MsgLobbyError {
  string code = 1;
  string message = 2;
}

message ListRoomsRequest {}

message ListRoomsResponse {
  repeated Room rooms = 1;
}
