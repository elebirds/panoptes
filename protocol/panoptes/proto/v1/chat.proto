syntax = "proto3";

package panoptes.proto.v1;

option go_package = "github.com/elebirds/panoptes/internal/gen/proto;protov1";
option csharp_namespace = "Panoptes.Protocol.V1";

enum ChatEmote {
  CHAT_EMOTE_UNSPECIFIED = 0;
  CHAT_EMOTE_THUMBS_UP = 1;
  CHAT_EMOTE_THINKING = 2;
  CHAT_EMOTE_LAUGH = 3;
  CHAT_EMOTE_ANGRY = 4;
  CHAT_EMOTE_WARNING = 5;
  CHAT_EMOTE_GG = 6;
}

message ChatPayload {
  oneof body {
    ChatEmote emote = 1;
    string text = 2;
  }
}

message MsgSendGameChat {
  ChatPayload payload = 1;
}

message ChatCommand {
  oneof body {
    MsgSendGameChat send_game_chat = 1;
  }
}

message ChatEntry {
  int64 sequence = 1;
  string sender_player_id = 2;
  int32 turn = 3;
  string phase = 4;
  ChatPayload payload = 5;
}

message MsgGameChatPosted {
  ChatEntry entry = 1;
}

message MsgGameChatSync {
  repeated ChatEntry entries = 1;
}
