syntax = "proto3";

package panoptes.proto.v1;

import "game_state.proto";

option go_package = "github.com/elebirds/panoptes/internal/gen/proto/v1;protov1";
option csharp_namespace = "Panoptes.Protocol.V1";

message TurnEvent {
  string type = 1;
  map<string, string> data = 2;
}

message SettlementSection {
  string section = 1;
  repeated TurnEvent events = 2;
}

message MsgTurnSettlement {
  repeated SettlementSection sections = 1;
  int32 turn = 2;
  string phase = 3;
  string next_phase = 4;
  repeated NodeView nodes = 5;
  repeated UnitView units = 6;
  PlayerView my_player_after = 7;
  PlayerResearchView my_research_after = 8;
}
